query ElunoraVerifyPayment($id: ID!) { order(id:$id) { id updatedAt taxesIncluded customAttributes { key value } lineItems(first:2) { nodes { quantity originalUnitPriceSet { presentmentMoney { amount currencyCode } } } } totalPriceSet { presentmentMoney { amount currencyCode } } totalTaxSet { presentmentMoney { amount currencyCode } } currentTotalTaxSet { presentmentMoney { amount currencyCode } } totalDiscountsSet { presentmentMoney { amount currencyCode } } totalReceivedSet { presentmentMoney { amount currencyCode } } totalRefundedSet { presentmentMoney { amount currencyCode } } } }
query ElunoraExistingWebhooks { webhookSubscriptions(first:250) { nodes { topic uri } } }
mutation ElunoraAppScopeHook($input:WebhookSubscriptionInput!) { webhookSubscriptionCreate(topic:APP_SCOPES_UPDATE,webhookSubscription:$input) { userErrors { field message } } }
